#####
#
# This file maps all the topics that are to be used on the uXRCE-DDS client for ommpc.
#
#####
publications:
  - topic: fm/out/vehicle_imu
    type: px4_msgs::msg::VehicleImu

  - topic: fm/out/vehicle_odometry
    type: px4_msgs::msg::VehicleOdometry

  - topic: fm/out/vehicle_status
    type: px4_msgs::msg::VehicleStatus

subscriptions:
  - topic: fm/in/trajectory_setpoint
    type: px4_msgs::msg::TrajectorySetpoint

  - topic: fm/in/vehicle_command
    type: px4_msgs::msg::VehicleCommand

  - topic: fm/in/offboard_control_mode
    type: px4_msgs::msg::OffboardControlMode

subscriptions_multi:
  - topic: /fmu/in/aux_global_position
    type: px4_msgs::msg::AuxGlobalPosition
    route_field: id
    max_instances: 4
